<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tableTitle tableDesc" class="table-svg">
  <title id="tableTitle">A table with one filled seat and three open seats</title>
  <desc id="tableDesc">An illustration of a round table. One seat is filled, representing the founder. Three seats are open, dashed, and waiting — representing the three founding trustee positions still needed.</desc>

  <defs>
    <symbol id="chair-filled" viewBox="-30 -32 60 64">
      <rect x="-28" y="-32" width="56" height="14" rx="7" fill="#0a0a0a"/>
      <rect x="-26" y="-16" width="52" height="48" rx="14" fill="#131313"/>
    </symbol>
    <symbol id="chair-open" viewBox="-30 -32 60 64">
      <rect x="-28" y="-32" width="56" height="14" rx="7" fill="none" stroke="#b54c16" stroke-width="2.5" stroke-dasharray="4 5"/>
      <rect x="-26" y="-16" width="52" height="48" rx="14" fill="#fafaf7" stroke="#b54c16" stroke-width="2.5" stroke-dasharray="4 5"/>
    </symbol>
  </defs>

  <circle cx="240" cy="240" r="104" fill="#c7b291" stroke="#a08a63" stroke-width="3"/>
  <circle cx="240" cy="240" r="82" fill="none" stroke="#a08a63" stroke-width="1.5" opacity="0.45"/>
  <circle cx="240" cy="240" r="58" fill="none" stroke="#a08a63" stroke-width="1.5" opacity="0.3"/>

  <g transform="translate(240,65)"><use href="#chair-filled" width="60" height="64"/></g>
  <g class="seat-open" transform="translate(415,240) rotate(90)"><use href="#chair-open" width="60" height="64"/></g>
  <g class="seat-open" transform="translate(240,415) rotate(180)"><use href="#chair-open" width="60" height="64"/></g>
  <g class="seat-open" transform="translate(65,240) rotate(270)"><use href="#chair-open" width="60" height="64"/></g>
</svg>
