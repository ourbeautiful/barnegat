<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tableTitle tableDesc" class="table-svg">
  <title id="tableTitle">A table with one filled seat and three open seats</title>
  <desc id="tableDesc">An illustration of a round table. One seat is filled, representing the founder. Three seats are open, dashed, and waiting — representing the three founding trustee positions still needed.</desc>

  <defs>
    <symbol id="chair-filled" viewBox="-30 -32 60 64">
      <rect x="-28" y="-32" width="56" height="14" rx="7" fill="#122820"/>
      <rect x="-26" y="-16" width="52" height="48" rx="14" fill="#1B3A2B"/>
    </symbol>
    <symbol id="chair-open" viewBox="-30 -32 60 64">
      <rect x="-28" y="-32" width="56" height="14" rx="7" fill="none" stroke="#B8872A" stroke-width="2.5" stroke-dasharray="4 5"/>
      <rect x="-26" y="-16" width="52" height="48" rx="14" fill="#FAF1DC" stroke="#B8872A" stroke-width="2.5" stroke-dasharray="4 5"/>
      <path d="M240 240" />
    </symbol>
  </defs>

  <!-- table top -->
  <circle cx="240" cy="240" r="104" fill="#C9A876" stroke="#A9814C" stroke-width="3"/>
  <circle cx="240" cy="240" r="82" fill="none" stroke="#A9814C" stroke-width="1.5" opacity="0.45"/>
  <circle cx="240" cy="240" r="58" fill="none" stroke="#A9814C" stroke-width="1.5" opacity="0.3"/>

  <!-- founder's seat: top, filled -->
  <g transform="translate(240,65)">
    <use href="#chair-filled" width="60" height="64"/>
  </g>

  <!-- three open seats -->
  <g class="seat-open" transform="translate(415,240) rotate(90)">
    <use href="#chair-open" width="60" height="64"/>
  </g>
  <g class="seat-open" transform="translate(240,415) rotate(180)">
    <use href="#chair-open" width="60" height="64"/>
  </g>
  <g class="seat-open" transform="translate(65,240) rotate(270)">
    <use href="#chair-open" width="60" height="64"/>
  </g>
</svg>
