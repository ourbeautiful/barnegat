<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {{ site.data.site.chapter_name }}{% else %}{{ site.data.site.chapter_name }}: {{ site.data.site.chapter_status }} of {{ site.data.site.org_name }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip }}{% else %}{{ site.data.site.tagline }} {{ site.data.site.chapter_name }} is the founding chapter of {{ site.data.site.org_name }}, started by {{ site.data.site.founded_by }} in {{ site.data.site.location }}.{% endif %}">
<link rel="icon" href="{{ '/assets/img/obb-logo.png' | relative_url }}" type="image/png">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:title" content="{% if page.title %}{{ page.title }} · {{ site.data.site.chapter_name }}{% else %}{{ site.data.site.chapter_name }}{% endif %}">
<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.data.site.tagline }}{% endif %}">
<meta property="og:image" content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ '/assets/img/obb-logo.png' | absolute_url }}{% endif %}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary">

<link rel="preload" href="{{ '/assets/fonts/big-shoulders-display.woff' | relative_url }}" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
