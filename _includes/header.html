<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/obb-logo.png' | relative_url }}" alt="Our Beautiful Barnegat logo">
      <span class="brand-text">Our Beautiful Barnegat<span class="brand-sub">{{ site.data.site.chapter_status }} &middot; {{ site.data.site.org_name }}</span></span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" id="navToggle">
      <span class="sr-only">Menu</span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>

    <nav class="site-nav" id="primary-nav" aria-label="Primary">
      <ul>
        {% for item in site.data.site.nav %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.collection == 'updates' and item.url == '/updates/' %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
        {% endfor %}
        <li><a class="btn btn-tiger" href="{{ '/get-involved/' | relative_url }}">Join OBB</a></li>
      </ul>
    </nav>
  </div>
</header>
