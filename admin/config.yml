# Decap CMS configuration: https://decapcms.org/docs/configuration-options/
#
# backend.name "git-gateway" pairs with Netlify Identity for login (see the
# README section "Setting up the CMS login"). If you're using the GitHub
# OAuth proxy approach instead, swap this block back to name: github with
# base_url / auth_endpoint pointing at your proxy.

backend:
  name: git-gateway
  branch: main

publish_mode: simple
media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "updates"
    label: "Updates (Events & Announcements)"
    label_singular: "Update"
    folder: "_updates"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Announcement", "Event", "Impact Story", "Milestone"]
        default: "Announcement"
      - { label: "Short Summary", name: "excerpt", widget: "text", hint: "Shown on the Updates list page." }
      - { label: "Photo", name: "image", widget: "image", required: false }
      - { label: "Photo Description", name: "image_alt", widget: "string", required: false }
      - { label: "Full Story", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Organization Info"
        name: "site"
        file: "_data/site.yml"
        fields:
          - { label: "Organization Name", name: "org_name", widget: "string" }
          - { label: "Chapter Name", name: "chapter_name", widget: "string" }
          - { label: "Chapter Short Name", name: "chapter_short", widget: "string" }
          - { label: "Chapter Status", name: "chapter_status", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Phone (display)", name: "phone", widget: "string" }
          - { label: "Phone (dial link, e.g. +13472650166)", name: "phone_link", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Founded By", name: "founded_by", widget: "string" }
          - { label: "Age Range", name: "age_range", widget: "string" }
          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "X (Twitter) URL", name: "x", widget: "string" }
              - { label: "Instagram URL", name: "instagram", widget: "string" }
              - { label: "TikTok URL", name: "tiktok", widget: "string" }
          - label: "Navigation Links"
            name: "nav"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
